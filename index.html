<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive German A2 to Czech flashcards with audio, spaced repetition, unknown word review, and playful German and Czech love messages.">
  <meta name="keywords" content="German Czech flashcards, German A2 vocabulary, Czech translation, German vocabulary practice, Deutsch Tschechisch Karteikarten, German audio flashcards, spaced repetition, A2 German words, Czech love phrases, German love phrases">
  <title>German-Czech Flashcards</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff8ea;
      --paper-deep: #f3dcc0;
      --ink: #2f3a42;
      --muted: #6f746d;
      --line: rgba(87, 72, 48, 0.18);
      --green: #2f7667;
      --amber: #bb7a26;
      --red: #b75142;
      --blue: #4479a8;
      --bamboo-main: #c99348;
      --bamboo-light: #e0b168;
      --bamboo-dark: #9d6b2d;
      --shadow: 0 22px 48px rgba(91, 72, 43, 0.22);
      --steamer-width: 468px;
      --steamer-height: 276px;
      --footer-height: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      color: var(--ink);
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 249, 228, 0.96), rgba(255, 255, 255, 0) 34%),
        linear-gradient(160deg, #f8fbff 0%, #edf7f2 48%, #fff6e7 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 18px;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 14px;
    }

    .background-art {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .village-art {
      position: absolute;
      left: 50%;
      bottom: 120px;
      width: min(980px, 112vw);
      height: auto;
      transform: translateX(-50%);
      opacity: 0.38;
    }

    .bamboo-art {
      position: absolute;
      bottom: 58px;
      width: 180px;
      height: auto;
      opacity: 0.48;
    }

    .bamboo-art.left {
      left: 8px;
    }

    .bamboo-art.right {
      right: -18px;
      transform: scaleX(-1);
    }

    .lantern {
      position: absolute;
      top: 70px;
      width: 54px;
      height: 78px;
      opacity: 0.55;
      animation: lanternFloat 3.6s ease-in-out infinite;
    }

    .lantern.left {
      left: 10%;
    }

    .lantern.right {
      right: 12%;
      top: 106px;
      width: 46px;
      height: 68px;
      animation-delay: 0.7s;
    }

    .koi {
      position: absolute;
      left: 0;
      top: 0;
      width: 132px;
      height: auto;
      opacity: 0.62;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .koi-tail {
      transform-box: fill-box;
      transform-origin: 6% 50%;
      animation: koiTailWave 2.8s ease-in-out infinite;
    }

    .koi-bubble {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 55;
      width: min(430px, calc(100vw - 32px));
      min-height: 96px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(114, 164, 183, 0.16);
      border-radius: 999px;
      padding: 20px 30px;
      color: rgba(47, 58, 66, 0.8);
      background: rgba(247, 253, 255, 0.58);
      box-shadow:
        inset 0 8px 24px rgba(255, 255, 255, 0.72),
        0 12px 30px rgba(96, 132, 145, 0.08);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      overflow-wrap: anywhere;
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(0.96);
      transition: opacity 900ms ease, color 900ms ease, background 900ms ease, transform 900ms ease;
      pointer-events: none;
    }

    .koi-bubble::before,
    .koi-bubble::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(114, 164, 183, 0.14);
      border-radius: 50%;
      background: rgba(247, 253, 255, 0.42);
      box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.72);
    }

    .koi-bubble::before {
      left: 26px;
      bottom: -16px;
      width: 24px;
      height: 24px;
    }

    .koi-bubble::after {
      left: 58px;
      bottom: -34px;
      width: 13px;
      height: 13px;
    }

    .koi-bubble.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .koi-bubble.fading {
      color: rgba(47, 58, 66, 0);
      background: rgba(247, 253, 255, 0.08);
      opacity: 0;
    }

    .maltipoo-scene {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 54;
      pointer-events: none;
    }

    .maltipoo {
      position: absolute;
      left: 0;
      top: 0;
      width: 112px;
      height: auto;
      opacity: 0;
      transform: translate3d(-160px, 100vh, 0);
      transform-origin: 50% 88%;
      transition: opacity 900ms ease;
      will-change: transform, opacity;
      pointer-events: auto;
      cursor: pointer;
    }

    .maltipoo.visible {
      opacity: 1;
    }

    .maltipoo.fading {
      opacity: 0;
      transition:
        transform 1800ms ease-in,
        opacity 1800ms ease-in;
    }

    .maltipoo .tail {
      transform-origin: 30px 50px;
      animation: maltipooTail 1.2s ease-in-out infinite;
    }

    .maltipoo.walking .front-leg,
    .maltipoo.walking .rear-leg-far {
      animation: maltipooRunA 1500ms ease-in-out infinite;
      transform-origin: center top;
    }

    .maltipoo.walking .rear-leg-near,
    .maltipoo.walking .front-leg-far {
      animation: maltipooRunB 1500ms ease-in-out infinite;
      transform-origin: center top;
    }

    .maltipoo.sprinting .front-leg,
    .maltipoo.sprinting .rear-leg-far,
    .maltipoo.sprinting .rear-leg-near,
    .maltipoo.sprinting .front-leg-far {
      animation-duration: 260ms;
    }

    .maltipoo.sprinting .tail {
      animation-duration: 320ms;
    }

    .maltipoo.peeing .rear-leg-near {
      animation: none;
      transform: rotate(-52deg) translate(-5px, -2px);
      transform-origin: 56px 75px;
    }

    .maltipoo.peeing.facing-left .rear-leg-near {
      transform: rotate(52deg) translate(5px, -2px);
    }

    .maltipoo .pee-stream {
      opacity: 0;
      transform-origin: 58px 83px;
    }

    .maltipoo.peeing .pee-stream {
      opacity: 0.65;
      animation: peePulse 520ms ease-in-out infinite;
    }

    .dog-poop {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 53;
      width: var(--poop-width);
      height: var(--poop-height);
      border-radius: 999px;
      background: #b49c61;
      opacity: 0.95;
      transform: translate3d(var(--poop-start-x), var(--poop-start-y), 0) rotate(var(--poop-rotate));
      transition: transform 900ms ease-in, opacity 240ms ease;
      pointer-events: none;
    }

    .dog-poop.dropped {
      transform: translate3d(var(--poop-end-x), var(--poop-end-y), 0) rotate(var(--poop-rotate));
    }

    .dog-bubble {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 56;
      width: min(320px, calc(100vw - 36px));
      min-height: 82px;
      padding: 16px 22px;
      border: 1px solid rgba(94, 142, 92, 0.22);
      border-radius: 18px;
      background: rgba(255, 252, 244, 0.9);
      box-shadow: 0 12px 28px rgba(84, 99, 68, 0.13);
      color: rgba(47, 58, 66, 0.86);
      opacity: 0;
      transform: translate3d(-999px, -999px, 0) scale(0.96);
      transition: opacity 180ms ease;
    }

    .dog-bubble.visible {
      opacity: 1;
      transform: translate3d(var(--dog-bubble-x), var(--dog-bubble-y), 0) scale(1);
    }

    .dog-bubble .dog-word {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .dog-bubble .dog-translation {
      margin-top: 6px;
      color: rgba(80, 92, 82, 0.82);
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    @keyframes lanternFloat {
      0%, 100% {
        transform: translateY(0) rotate(-1deg);
      }
      50% {
        transform: translateY(8px) rotate(1.5deg);
      }
    }

    @keyframes koiTailWave {
      0%, 100% {
        transform: rotate(-3deg) scaleX(0.98);
      }
      50% {
        transform: rotate(8deg) scaleX(1.02);
      }
    }

    @keyframes maltipooTail {
      0%, 100% {
        transform: rotate(-8deg);
      }
      50% {
        transform: rotate(16deg);
      }
    }

    @keyframes maltipooRunA {
      0%, 100% {
        transform: rotate(4deg);
      }
      50% {
        transform: rotate(-5deg);
      }
    }

    @keyframes maltipooRunB {
      0%, 100% {
        transform: rotate(-4deg);
      }
      50% {
        transform: rotate(5deg);
      }
    }

    @keyframes peePulse {
      0%, 100% {
        opacity: 0.45;
        transform: scaleY(0.86);
      }
      50% {
        opacity: 0.78;
        transform: scaleY(1.04);
      }
    }

    .infobar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 65;
      width: min(calc(100vw - 36px), 860px);
      margin: 0;
      border: 1px solid rgba(80, 67, 48, 0.16);
      border-radius: 8px;
      background: rgba(255, 252, 244, 0.86);
      box-shadow: 0 10px 26px rgba(82, 67, 42, 0.1);
      backdrop-filter: blur(10px);
      opacity: 0.96;
      transform: translate(-50%, calc(100% + 18px));
      transition: transform 220ms ease, opacity 220ms ease;
    }

    .scene.settings-open .infobar,
    .infobar:hover,
    .infobar:focus-within {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
      min-height: 32px;
      padding: 5px 8px;
      border: 1px solid rgba(80, 67, 48, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
    }

    label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .settings input {
      width: 72px;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 7px;
      text-align: right;
      color: var(--ink);
      background: #ffffff;
    }

    .source-settings {
      gap: 10px;
    }

    .source-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: none;
      white-space: nowrap;
    }

    .source-option input {
      width: auto;
      min-height: auto;
    }

    .stage {
      position: relative;
      z-index: 20;
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      place-items: center;
      min-height: clamp(620px, calc(100vh - var(--footer-height) - 46px), 780px);
    }

    .card-stage {
      position: relative;
      width: min(100%, 620px);
      min-height: clamp(600px, calc(100vh - var(--footer-height) - 70px), 740px);
      display: grid;
      justify-items: center;
      align-items: start;
      padding: 20px;
    }

    .unknown-toggle {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 60;
      min-height: 42px;
      border: 1px solid rgba(183, 81, 66, 0.28);
      border-radius: 8px 8px 0 0;
      padding: 9px 12px;
      color: #ffffff;
      background: var(--red);
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 12px 24px rgba(96, 62, 42, 0.2);
      transform: translateY(-50%) rotate(-90deg) translateY(-46px);
      transform-origin: right center;
    }

    .settings-toggle {
      position: fixed;
      right: 16px;
      top: 128px;
      z-index: 60;
      min-height: 42px;
      border: 1px solid rgba(47, 118, 103, 0.28);
      border-radius: 8px 8px 0 0;
      padding: 9px 12px;
      color: #ffffff;
      background: var(--green);
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 12px 24px rgba(96, 62, 42, 0.18);
      transform: translateY(-50%) rotate(-90deg) translateY(-46px);
      transform-origin: right center;
    }

    .unknown-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      width: min(380px, calc(100vw - 42px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-left: 1px solid rgba(80, 67, 48, 0.18);
      background: rgba(255, 252, 244, 0.97);
      box-shadow: -22px 0 42px rgba(91, 72, 43, 0.18);
      transform: translateX(100%);
      transition: transform 220ms ease;
    }

    .unknown-panel.open {
      transform: translateX(0);
    }

    .unknown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid rgba(80, 67, 48, 0.14);
    }

    .unknown-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.15;
    }

    .unknown-count {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .close-panel {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(80, 67, 48, 0.16);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.7);
      font-weight: 900;
      line-height: 1;
    }

    .unknown-list {
      min-height: 0;
      margin: 0;
      padding: 10px 12px 18px;
      overflow-y: auto;
      list-style: none;
    }

    .unknown-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      gap: 8px;
      align-items: start;
      padding: 11px 8px;
      border-bottom: 1px solid rgba(80, 67, 48, 0.12);
    }

    .unknown-remove {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      color: #c53a2c;
      background: transparent;
      font-size: 1.1rem;
      font-weight: 900;
      line-height: 1;
    }

    .unknown-remove:hover,
    .unknown-remove:focus-visible {
      background: rgba(197, 58, 44, 0.1);
      outline: none;
    }

    .unknown-czech {
      color: #5f4632;
      font-size: 0.95rem;
      font-weight: 900;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .unknown-german {
      margin-top: 4px;
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .unknown-empty {
      padding: 18px 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .steamer-wrap {
      position: absolute;
      left: 50%;
      bottom: -66px;
      width: min(var(--steamer-width), calc(100vw - 36px));
      height: var(--steamer-height);
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    .steamer-lid {
      position: absolute;
      left: -6px;
      right: -6px;
      top: 56px;
      height: 66px;
      z-index: 30;
      border-radius: 50% 50% 42% 42%;
      background:
        radial-gradient(ellipse at 50% 8%, #f7d99b 0 16%, transparent 17%),
        repeating-linear-gradient(90deg, rgba(92, 55, 20, 0.18) 0 8px, rgba(255, 235, 177, 0.22) 8px 18px),
        linear-gradient(#edc77c 0%, #d39746 68%, #a96a28 100%);
      border: 6px solid #7f4f22;
      box-shadow:
        inset 0 12px 10px rgba(255, 241, 193, 0.42),
        inset 0 -10px 12px rgba(103, 64, 24, 0.22),
        0 13px 16px rgba(92, 59, 25, 0.2);
      transform-origin: 17% 78%;
      transition: transform 360ms cubic-bezier(.2,.86,.2,1), top 360ms cubic-bezier(.2,.86,.2,1);
    }

    .steamer-lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -20px;
      width: 72px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 50% 50% 42% 42%;
      background: linear-gradient(#edc782, #b8772d);
      border: 5px solid var(--bamboo-dark);
      box-shadow: inset 0 8px 7px rgba(255, 240, 189, 0.38);
    }

    .steamer-lid::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 10px;
      height: 16px;
      border-radius: 50%;
      background: rgba(90, 55, 19, 0.18);
    }

    .scene.lid-open .steamer-lid {
      top: 0;
      transform: translateX(-50px) rotate(-24deg);
    }

    .steamer-back {
      position: absolute;
      left: 9px;
      right: 9px;
      top: 108px;
      height: 54px;
      z-index: 9;
      border-radius: 50%;
      background:
        repeating-linear-gradient(90deg, rgba(126, 83, 32, 0.15) 0 10px, rgba(255, 236, 177, 0.14) 10px 22px),
        linear-gradient(#e5b96d, #c98f40);
      border: 5px solid var(--bamboo-dark);
      box-shadow: inset 0 9px 8px rgba(255, 238, 184, 0.35);
    }

    .steamer-body,
    .steamer-tier {
      position: absolute;
      left: 0;
      right: 0;
      height: 118px;
      z-index: 2;
      border-radius: 0 0 46px 46px / 0 0 24px 24px;
      background:
        repeating-linear-gradient(90deg, rgba(91, 55, 21, 0.24) 0 8px, rgba(255, 232, 166, 0.18) 8px 17px),
        repeating-linear-gradient(0deg, rgba(100, 61, 22, 0.18) 0 5px, rgba(255, 229, 157, 0.22) 5px 13px),
        linear-gradient(90deg, #e7b760, #c98c37 50%, #dea252);
      border: 6px solid #7f4f22;
      box-shadow:
        inset 18px 0 14px rgba(255, 230, 174, 0.22),
        inset -16px 0 14px rgba(104, 66, 27, 0.13),
        0 22px 28px rgba(112, 79, 40, 0.18);
    }

    .steamer-body {
      bottom: 42px;
      z-index: 3;
    }

    .steamer-tier.middle {
      bottom: 36px;
      left: 10px;
      right: 10px;
      z-index: 2;
      filter: brightness(0.96);
    }

    .steamer-tier.bottom {
      bottom: 4px;
      left: 20px;
      right: 20px;
      z-index: 1;
      filter: brightness(0.9);
    }

    .steamer-rim,
    .steamer-tier::before,
    .steamer-tier::after {
      position: absolute;
      border-radius: 50%;
      background:
        repeating-linear-gradient(90deg, rgba(97, 57, 19, 0.16) 0 11px, rgba(255, 235, 174, 0.22) 11px 23px),
        linear-gradient(#eac06d, #b9792e);
      border: 6px solid #7f4f22;
      box-shadow:
        inset 0 9px 7px rgba(255, 237, 186, 0.42),
        inset 0 -8px 9px rgba(105, 65, 22, 0.18);
    }

    .steamer-rim {
      left: -6px;
      right: -6px;
      top: 86px;
      height: 54px;
      z-index: 10;
    }

    .steamer-tier::before {
      content: "";
      left: -6px;
      right: -6px;
      top: -28px;
      height: 52px;
      z-index: 3;
    }

    .steamer-tier::after {
      content: "";
      left: 24px;
      right: 24px;
      top: -12px;
      height: 18px;
      z-index: 9;
      border: 0;
      background: rgba(91, 55, 21, 0.18);
      box-shadow: inset 0 7px 8px rgba(69, 42, 17, 0.14);
    }

    .steamer-lip {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 104px;
      height: 22px;
      z-index: 9;
      border-radius: 50%;
      background: rgba(119, 76, 27, 0.28);
      box-shadow: inset 0 7px 8px rgba(69, 42, 17, 0.16);
    }

    .steam {
      position: absolute;
      left: 50%;
      bottom: 104px;
      z-index: 4;
      width: 170px;
      height: 120px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0.55;
    }

    .steam span {
      position: absolute;
      bottom: 0;
      width: 18px;
      height: 78px;
      border-left: 4px solid rgba(255, 255, 255, 0.86);
      border-radius: 50%;
      animation: steamRise 2.8s ease-in-out infinite;
    }

    .steam span:nth-child(1) { left: 34px; animation-delay: 0s; }
    .steam span:nth-child(2) { left: 78px; height: 98px; animation-delay: 0.45s; }
    .steam span:nth-child(3) { left: 118px; animation-delay: 0.9s; }

    @keyframes steamRise {
      0%, 100% {
        transform: translateY(14px) scale(0.92);
        opacity: 0;
      }
      42% {
        opacity: 0.75;
      }
      72% {
        transform: translateY(-20px) scale(1.06);
        opacity: 0.12;
      }
    }

    .dpad {
      display: none;
      position: absolute;
      left: 50%;
      bottom: -28px;
      transform: translateX(-50%);
      z-index: 40;
      grid-template-columns: 50px 58px 50px;
      grid-template-rows: 50px 58px 50px;
      grid-template-areas:
        ".    up     ."
        "left center right"
        ".    down   .";
      gap: 8px;
      pointer-events: none;
    }

    .dpad-btn {
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 10px 18px rgba(46, 32, 15, 0.32);
      pointer-events: auto;
      opacity: 0.7;
      filter: brightness(0.8);
    }

    .dpad-up {
      grid-area: up;
      background: var(--amber);
    }

    .dpad-left {
      grid-area: left;
      background: var(--green);
    }

    .dpad-center {
      grid-area: center;
      background: var(--green);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }

    .dpad-right {
      grid-area: right;
      background: var(--red);
    }

    .dpad-down {
      grid-area: down;
      background: var(--blue);
    }

    @media (max-width: 620px) {
      .dpad {
        display: grid;
      }
    }

    .flashcard {
      position: relative;
      z-index: 2;
      width: min(100%, 460px);
      min-height: 380px;
      display: grid;
      place-items: center;
      text-align: center;
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .flashcard.enter {
      animation: fadeIn 180ms ease-out;
    }

    .flashcard.prepare-pop {
      opacity: 0;
      transform: translate3d(0, 245px, 0) scale(0.54);
      transform-origin: 50% 82%;
    }

    .flashcard.pop-from-steamer {
      animation: popFromSteamer 720ms cubic-bezier(.18,.92,.22,1.08) forwards;
      transform-origin: 50% 82%;
    }

    .flashcard.exit-left {
      animation: exitLeft 420ms cubic-bezier(.32,.02,.64,.98) forwards;
    }

    .flashcard.exit-up {
      animation: exitUp 420ms cubic-bezier(.32,.02,.64,.98) forwards;
    }

    .flashcard.exit-right {
      animation: exitRight 420ms cubic-bezier(.32,.02,.64,.98) forwards;
    }

    .bun {
      position: absolute;
      top: -116.5px;
      left: 50%;
      width: min(100%, 390px);
      min-height: 245px;
      transform: translateX(-50%);
      padding: 60px 48px 62px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 22px 28px rgba(91, 72, 43, 0.22));
    }

    .bun-art,
    .dumpling-art,
    .potato-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .bun-art {
      z-index: 0;
    }

    .answer-stack {
      position: absolute;
      left: 50%;
      bottom: 58.5px;
      width: min(86%, 340px);
      display: grid;
      gap: 10px;
      justify-items: center;
      transform: translateX(-50%) translateY(8px) scale(0.96);
      opacity: 1;
      transition: none;
      z-index: 3;
    }

    .dumpling {
      position: relative;
      width: 100%;
      min-height: 128px;
      padding: 34px 42px 24px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 16px 18px rgba(91, 72, 43, 0.18));
    }

    .dumpling-art {
      z-index: 0;
    }

    .sweet-potato {
      position: relative;
      width: 160%;
      min-height: 74px;
      padding: 16px 30px;
      display: none;
      place-items: center;
      filter: drop-shadow(0 12px 14px rgba(74, 36, 21, 0.24));
    }

    .sweet-potato.active {
      display: grid;
    }

    .potato-art {
      z-index: 0;
    }

    .answer-stack.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(34px) scale(0.86);
    }

    .answer-stack.prepare-pop {
      opacity: 0;
      visibility: visible;
      transform: translateX(-50%) translateY(238px) scale(0.54);
    }

    .answer-stack.pop-from-steamer {
      visibility: visible;
      animation: dumplingPopFromSteamer 620ms cubic-bezier(.18,.92,.22,1.08) forwards;
    }

    .answer-stack.return-to-steamer {
      visibility: visible;
      animation: dumplingReturnToSteamer 520ms cubic-bezier(.32,.02,.64,.98) forwards;
    }

    .german {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      max-height: 120px;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.1;
      color: #5f4632;
      overflow-wrap: anywhere;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .answer {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      max-height: 62px;
      color: var(--green);
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.14;
      overflow-wrap: anywhere;
    }

    .answer.hidden {
      color: transparent;
    }

    .example-text {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      max-height: 54px;
      color: #fff3e2;
      font-size: 0.92rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1.22;
      overflow-wrap: anywhere;
      text-shadow: 0 1px 2px rgba(40, 18, 8, 0.4);
    }

    .action-button {
      min-height: 32px;
      border: 1px solid rgba(80, 67, 48, 0.16);
      border-radius: 8px;
      padding: 6px 9px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.15;
      transition: transform 160ms ease, background 160ms ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      background: #ffffff;
    }

    .action-button:active {
      transform: translateY(1px);
    }

    .known {
      color: var(--green);
    }

    .unsure {
      color: var(--amber);
    }

    .unknown {
      color: var(--red);
    }

    .audio {
      color: var(--blue);
    }

    .button-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .infobar {
      padding: 10px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
    }

    .info-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .pill {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border: 1px solid rgba(80, 67, 48, 0.14);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.58);
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.15;
    }

    .pill strong {
      color: var(--ink);
    }

    .legend {
      justify-content: flex-end;
    }

    .legend .pill {
      font-weight: 700;
    }

    .toggle-answer {
      min-height: 32px;
      border: 1px solid rgba(47, 118, 103, 0.26);
      border-radius: 8px;
      padding: 6px 10px;
      color: #ffffff;
      background: var(--green);
      font-weight: 800;
      line-height: 1.15;
    }

    .complete {
      position: relative;
      z-index: 2;
      display: none;
      width: min(100%, 430px);
      border: 1px solid rgba(94, 70, 43, 0.16);
      border-radius: 8px;
      padding: 28px 18px;
      text-align: center;
      background: rgba(255, 252, 244, 0.92);
      box-shadow: var(--shadow);
    }

    .complete h2 {
      margin: 0 0 10px;
      font-size: 1.45rem;
    }

    .complete p {
      margin: 7px 0;
      color: var(--muted);
      font-weight: 700;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate3d(0, 22px, 0) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes popFromSteamer {
      0% {
        opacity: 0;
        transform: translate3d(0, 245px, 0) scale(0.54);
      }
      62% {
        opacity: 1;
        transform: translate3d(0, -18px, 0) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes dumplingPopFromSteamer {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(238px) scale(0.54);
      }
      66% {
        opacity: 1;
        transform: translateX(-50%) translateY(-10px) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(8px) scale(0.96);
      }
    }

    @keyframes dumplingReturnToSteamer {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(8px) scale(0.96);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(238px) scale(0.54);
      }
    }

    @keyframes exitLeft {
      to {
        opacity: 0;
        transform: translate3d(-88%, 30px, 0) rotate(-10deg) scale(0.48);
      }
    }

    @keyframes exitUp {
      to {
        opacity: 0;
        transform: translate3d(0, -70%, 0) scale(0.48);
      }
    }

    @keyframes exitRight {
      to {
        opacity: 0;
        transform: translate3d(88%, 30px, 0) rotate(10deg) scale(0.48);
      }
    }

    @media (max-width: 620px) {
      .scene {
        padding: 12px;
        gap: 10px;
      }

      .infobar {
        width: 100%;
      }

      .settings {
        justify-content: space-between;
      }


      .stage {
        min-height: clamp(590px, calc(100vh - 190px), 650px);
      }

      .card-stage {
        min-height: clamp(570px, calc(100vh - 210px), 630px);
        padding: 18px 2px 36px;
      }

      .flashcard {
        width: min(100%, 370px);
        min-height: 356px;
      }

      .bun {
        top: -104px;
        width: min(100% - 54px, 320px);
        min-height: 220px;
        padding: 52px 34px 56px;
      }

      .answer-stack {
        width: min(82%, 282px);
        bottom: 51px;
      }

      .dumpling {
        min-height: 118px;
        padding: 30px 30px 22px;
      }

      .sweet-potato {
        min-height: 64px;
        padding: 12px 22px;
      }

      .steamer-wrap {
        bottom: -52px;
        width: min(351px, calc(100vw - 24px));
        height: 236px;
      }

      .infobar {
        grid-template-columns: 1fr;
      }

      .legend {
        justify-content: flex-start;
      }

      .village-art {
        bottom: 112px;
        width: 760px;
      }

      .bamboo-art {
        width: 116px;
        bottom: 76px;
      }

      .lantern {
        top: 72px;
        width: 42px;
        height: 62px;
      }

      .koi {
        width: 86px;
      }

      .unknown-toggle,
      .settings-toggle {
        right: 10px;
      }
    }
  </style>
</head>

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function dateOnly(date) {
      return date.toISOString().slice(0, 10);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));

    function defaultStats() {
      return {
        reviewed: 0,
        known: 0,
        unsure: 0,
        unknown: 0,
        newIntroduced: 0

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        console.warn(`Could not load ${key}`, error);
        return fallback;
      }
    }

    function saveJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function loadDailyTarget() {
      const raw = localStorage.getItem(STORAGE_KEYS.target);
      if (raw === null) return DEFAULT_DAILY_TARGET;
      const saved = Number(raw);
      return Number.isFinite(saved) ? Math.max(MIN_DAILY_TARGET, Math.floor(saved)) : DEFAULT_DAILY_TARGET;
    }

    function saveDailyTarget(value) {
      dailyTarget = Math.max(MIN_DAILY_TARGET, Math.floor(Number(value) || DEFAULT_DAILY_TARGET));
      localStorage.setItem(STORAGE_KEYS.target, String(dailyTarget));
      elements.dailyTargetInput.value = dailyTarget;
      elements.targetNote.textContent = `Current target: ${dailyTarget}`;
      updateProgress();
    }

    function loadSource() {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      return SOURCES[saved] ? saved : DEFAULT_SOURCE;
    }

    function saveSource(source) {
      localStorage.setItem(STORAGE_KEYS.source, source);
    }

    function statesKey() {
      return `${STORAGE_KEYS.states}.${currentSource}`;
    }

    function statsDateKey() {
      return `${STORAGE_KEYS.statsDate}.${currentSource}`;
    }

    function statsKey() {
      return `${STORAGE_KEYS.stats}.${currentSource}`;
    }

    function loadStatsForToday() {
      const savedDate = localStorage.getItem(statsDateKey());
      if (savedDate !== todayKey()) {
        localStorage.setItem(statsDateKey(), todayKey());
        saveJson(statsKey(), defaultStats());
        return defaultStats();
      }
      return { ...defaultStats(), ...loadJson(statsKey(), defaultStats()) };
    }

    function saveState() {
      saveJson(statesKey(), cardStates);
      saveJson(statsKey(), todayStats);
    }

    function pulseSteamerLid() {
      clearTimeout(lidTimer);
      clearTimeout(lidCloseTimer);
      lidTimer = window.setTimeout(() => {
        elements.scene.classList.add("lid-open");
        lidCloseTimer = window.setTimeout(() => {
          elements.scene.classList.remove("lid-open");
        }, LID_CLOSE_AFTER_POP_DELAY);
      }, LID_OPEN_DELAY);
    }

    function clearSteamerTimers() {
      clearTimeout(lidTimer);
      clearTimeout(lidCloseTimer);
      clearTimeout(popTimer);
      clearTimeout(finishPopTimer);
      clearTimeout(dumplingPopTimer);
      clearTimeout(finishDumplingPopTimer);
      elements.answerStack.style.animation = "none";
      dumplingAnimating = false;
    }

    function resetProgress() {
      localStorage.removeItem(statesKey());
      localStorage.removeItem(statsDateKey());
      localStorage.removeItem(statsKey());
      cardStates = {};
      todayStats = defaultStats();
      localStorage.setItem(statsDateKey(), todayKey());
      saveJson(statsKey(), todayStats);
      currentCard = null;
      currentPrompt = null;
      queue = buildSessionQueue();
      elements.loadStatus.textContent = `${cards.length} cards`;
      renderUnknownList();
      showNextCard();
    }

    function getState(card) {
      return cardStates[card.id] || null;
    }

    function isDue(card) {
      const state = getState(card);
      return state && state.dueDate && state.dueDate <= todayKey();
    }

    function buildSessionQueue() {
      const isNotCurrent = (card) => !currentCard || card.id !== currentCard.id;
      const dueCards = cards.filter((card) => isNotCurrent(card) && isDue(card));
      const newLimitRemaining = Math.max(0, dailyTarget - todayStats.newIntroduced);
      const newCards = cards.filter((card) => isNotCurrent(card) && !getState(card)).slice(0, newLimitRemaining);
      return [...dueCards, ...newCards];
    }

    function updateProgress() {
      const remaining = queue.length + (currentCard ? 1 : 0);
      elements.sessionProgress.textContent = `${todayStats.reviewed} reviewed · ${remaining} queued`;
      elements.dailyProgress.textContent = `${todayStats.newIntroduced} / ${dailyTarget} new words`;
    }

    function unknownCards() {
      return cards.filter((card) => {
        const state = getState(card);
        return state && state.wrongCount > 0;
      });
    }

    function renderUnknownList() {
      const unknown = unknownCards();
      elements.unknownCount.textContent = `${unknown.length} ${unknown.length === 1 ? "word" : "words"}`;

      if (!unknown.length) {

    function removeUnknownCard(cardId) {

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")

    function koiBounds() {
      const width = elements.koi?.getBoundingClientRect().width || 132;
      const height = elements.koi?.getBoundingClientRect().height || 66;
      return {
        maxX: Math.max(0, window.innerWidth - width),
        maxY: Math.max(0, window.innerHeight - height),
        width,
        height
      };
    }

    function renderKoi() {
      elements.koi.style.transform = `translate3d(${koiMotion.x}px, ${koiMotion.y}px, 0) scaleX(${koiMotion.facing})`;
    }

    function chooseKoiTarget() {
      const bounds = koiBounds();
      koiMotion.targetX = randomBetween(0, bounds.maxX);
      koiMotion.targetY = randomBetween(0, bounds.maxY);
      koiMotion.speed = randomBetween(KOI_MIN_SPEED, KOI_MAX_SPEED);
    }

    function positionKoiBubble() {
      const bubbleWidth = elements.koiBubble.offsetWidth || 430;
      const bubbleHeight = elements.koiBubble.offsetHeight || 96;
      const bounds = koiBounds();
      const preferredX = koiMotion.facing === 1
        ? koiMotion.x + bounds.width * 0.12
        : koiMotion.x + bounds.width - bubbleWidth - bounds.width * 0.12;
      const preferredY = koiMotion.y - bubbleHeight - 24;
      const x = clamp(preferredX, 16, window.innerWidth - bubbleWidth - 16);
      const y = clamp(preferredY, 16, window.innerHeight - bubbleHeight - 16);
      elements.koiBubble.style.transform = `translate3d(${x}px, ${y}px, 0) scale(0.96)`;
    }

    function randomKoiMessage() {
      return KOI_MESSAGES[Math.floor(Math.random() * KOI_MESSAGES.length)];
    }

    function scheduleKoiBubble() {
      clearTimeout(koiMotion.bubbleTimer);
      const delay = KOI_BUBBLE_INTERVAL + randomBetween(-KOI_BUBBLE_JITTER, KOI_BUBBLE_JITTER);
      koiMotion.bubbleTimer = window.setTimeout(showKoiBubble, Math.max(KOI_BUBBLE_VISIBLE_MS, delay));
    }

    function showKoiBubble() {
      if (!elements.koi || !elements.koiBubble) return;
      koiMotion.paused = true;
      clearTimeout(koiMotion.fadeTimer);
      clearTimeout(koiMotion.hideTimer);

      elements.koiBubble.textContent = randomKoiMessage();
      elements.koiBubble.className = "koi-bubble";
      positionKoiBubble();

      requestAnimationFrame(() => {
        elements.koiBubble.classList.add("visible");
        elements.koiBubble.style.transform = elements.koiBubble.style.transform.replace("scale(0.96)", "scale(1)");
      });

      koiMotion.fadeTimer = window.setTimeout(() => {
        elements.koiBubble.classList.add("fading");
      }, KOI_BUBBLE_VISIBLE_MS);

      koiMotion.hideTimer = window.setTimeout(() => {
        elements.koiBubble.className = "koi-bubble";
        elements.koiBubble.textContent = "";
        koiMotion.paused = false;
        koiMotion.lastFrame = null;
        chooseKoiTarget();
        scheduleKoiBubble();
      }, KOI_BUBBLE_VISIBLE_MS + KOI_BUBBLE_FADE_MS);
    }

    function moveKoi(timestamp) {
      if (!elements.koi) return;

      if (koiMotion.lastFrame === null) {
        koiMotion.lastFrame = timestamp;
      }

      const elapsedSeconds = Math.min(0.08, (timestamp - koiMotion.lastFrame) / 1000);
      koiMotion.lastFrame = timestamp;

      if (!koiMotion.paused) {
        const dx = koiMotion.targetX - koiMotion.x;
        const dy = koiMotion.targetY - koiMotion.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 2) {
          chooseKoiTarget();
        } else {
          const step = Math.min(distance, koiMotion.speed * elapsedSeconds);
          koiMotion.x += (dx / distance) * step;
          koiMotion.y += (dy / distance) * step;
          koiMotion.facing = dx > 0 ? -1 : 1;
        }

        const bounds = koiBounds();
        koiMotion.x = clamp(koiMotion.x, 0, bounds.maxX);
        koiMotion.y = clamp(koiMotion.y, 0, bounds.maxY);
        renderKoi();
      }

      koiMotion.animationFrame = requestAnimationFrame(moveKoi);
    }

    function initKoi() {
      if (!elements.koi || !elements.koiBubble) return;
      const bounds = koiBounds();
      koiMotion.x = randomBetween(0, bounds.maxX);
      koiMotion.y = randomBetween(0, bounds.maxY);
      chooseKoiTarget();
      renderKoi();
      scheduleKoiBubble();
      koiMotion.animationFrame = requestAnimationFrame(moveKoi);
    }

    function handleKoiResize() {
      if (!elements.koi) return;
      const bounds = koiBounds();
      koiMotion.x = clamp(koiMotion.x, 0, bounds.maxX);
      koiMotion.y = clamp(koiMotion.y, 0, bounds.maxY);
      koiMotion.targetX = clamp(koiMotion.targetX, 0, bounds.maxX);
      koiMotion.targetY = clamp(koiMotion.targetY, 0, bounds.maxY);
      renderKoi();
      if (koiMotion.paused) {
        positionKoiBubble();
      }
    }

    function randomUnknownCard() {
      const unknown = unknownCards();
      if (!unknown.length) return null;
      return unknown[Math.floor(Math.random() * unknown.length)];
    }

    function setDogTransform(x, y, facing = dogMotion.facing) {
      dogMotion.x = x;
      dogMotion.y = y;
      dogMotion.facing = facing;
      elements.maltipoo.style.transform = `translate3d(${x}px, ${y}px, 0) scaleX(${facing})`;
      elements.maltipoo.classList.toggle("facing-left", facing === -1);
    }

    function positionDogBubble() {
      const bubbleWidth = elements.dogBubble.offsetWidth || 320;
      const bubbleHeight = elements.dogBubble.offsetHeight || 82;
      const dogWidth = elements.maltipoo?.getBoundingClientRect().width || 112;
      const headX = dogMotion.facing === 1 ? dogMotion.x + dogWidth * 0.78 : dogMotion.x + dogWidth * 0.08;
      const x = clamp(headX - bubbleWidth * 0.5, 18, window.innerWidth - bubbleWidth - 18);
      const y = clamp(dogMotion.y - bubbleHeight - 12, 18, window.innerHeight - bubbleHeight - 18);
      elements.dogBubble.style.setProperty("--dog-bubble-x", `${x}px`);
      elements.dogBubble.style.setProperty("--dog-bubble-y", `${y}px`);
    }

    function showDogBubbleAtHead(card) {
      elements.dogBubble.innerHTML = `
        <div class="dog-word">${escapeHtml(card.czech)}</div>
        <div class="dog-translation">${escapeHtml(card.german)}</div>
      `;
      elements.dogBubble.classList.remove("visible");
      positionDogBubble();
      elements.dogBubble.getBoundingClientRect();
      elements.dogBubble.classList.add("visible");
    }

    function hideDogBubble() {
      elements.dogBubble.classList.remove("visible");
      elements.dogBubble.innerHTML = "";
    }

    function dropDogPoop(startX, startY, groundY) {
      const poop = document.createElement("div");
      const width = randomBetween(18, 34);
      const height = randomBetween(5, 9);
      const endX = startX + randomBetween(-2, 2);
      const endY = groundY - height;
      poop.className = "dog-poop";
      poop.style.setProperty("--poop-width", `${width}px`);
      poop.style.setProperty("--poop-height", `${height}px`);
      poop.style.setProperty("--poop-start-x", `${startX}px`);
      poop.style.setProperty("--poop-start-y", `${startY}px`);
      poop.style.setProperty("--poop-end-x", `${endX}px`);
      poop.style.setProperty("--poop-end-y", `${endY}px`);
      poop.style.setProperty("--poop-rotate", `${randomBetween(-12, 12)}deg`);
      document.body.appendChild(poop);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          poop.classList.add("dropped");
        });
      });
    }

    function scheduleMaltipoo() {
      clearTimeout(dogMotion.timer);
      const delay = DOG_INTERVAL + randomBetween(-DOG_INTERVAL_JITTER, DOG_INTERVAL_JITTER);
      dogMotion.timer = window.setTimeout(showMaltipoo, Math.max(1000, delay));
    }

    function clearDogTimers() {
      clearTimeout(dogMotion.stageTimer);
      clearTimeout(dogMotion.bubbleTimer);
      clearTimeout(dogMotion.fadeTimer);
    }

    function dogBounds() {
      const dogWidth = elements.maltipoo?.getBoundingClientRect().width || 112;
      const dogHeight = elements.maltipoo?.getBoundingClientRect().height || 180;
      const minY = 18;
      const maxY = Math.max(minY, window.innerHeight - dogHeight - 18);
      return {
        maxX: Math.max(0, window.innerWidth - dogWidth),
        minY,
        maxY,
        width: dogWidth,
        height: dogHeight
      };
    }

    function dogAvoidsStage(x, y, bounds) {
      const stage = elements.cardStage?.getBoundingClientRect();
      if (!stage) return true;
      const centerX = x + bounds.width / 2;
      const centerY = y + bounds.height / 2;
      const marginX = bounds.width * 0.35;
      const marginY = bounds.height * 0.25;
      const insideX = centerX > stage.left - marginX && centerX < stage.right + marginX;
      const insideY = centerY > stage.top - marginY && centerY < stage.bottom + marginY;
      return !(insideX && insideY);
    }

    function chooseDogTarget() {
      const bounds = dogBounds();
      let x = 0;
      let y = 0;
      for (let attempt = 0; attempt < 18; attempt += 1) {
        x = randomBetween(0, bounds.maxX);
        y = randomBetween(bounds.minY, bounds.maxY);
        if (dogAvoidsStage(x, y, bounds)) break;
      }
      dogMotion.targetX = x;
      dogMotion.targetY = y;
      dogMotion.speed = randomBetween(DOG_MIN_SPEED, DOG_MAX_SPEED);
    }

    function startDogSprint() {
      if (!elements.maltipoo || dogMotion.acting || dogMotion.sprint?.active) return;

      let dirX = dogMotion.targetX - dogMotion.x;
      let dirY = dogMotion.targetY - dogMotion.y;
      let magnitude = Math.hypot(dirX, dirY);
      if (magnitude < 1) {
        dirX = dogMotion.facing >= 0 ? 1 : -1;
        dirY = 0;
        magnitude = 1;
      }

      const sprintDistance = elements.dumpling?.getBoundingClientRect().width || DOG_SPRINT_FALLBACK_DISTANCE;

      dogMotion.sprint = {
        active: true,
        remaining: sprintDistance,
        dirX: dirX / magnitude,
        dirY: dirY / magnitude,
        speed: Math.max(dogMotion.speed, DOG_MIN_SPEED) * DOG_SPRINT_MULTIPLIER
      };
      dogMotion.paused = false;
      elements.maltipoo.classList.add("walking", "sprinting");
    }

    function stepDogSprint(elapsedSeconds) {
      const sprint = dogMotion.sprint;
      const bounds = dogBounds();
      const step = Math.min(sprint.remaining, sprint.speed * elapsedSeconds);

      let nextX = dogMotion.x + sprint.dirX * step;
      let nextY = dogMotion.y + sprint.dirY * step;

      if (nextX < 0) {
        nextX = -nextX;
        sprint.dirX = Math.abs(sprint.dirX);
      } else if (nextX > bounds.maxX) {
        nextX = bounds.maxX - (nextX - bounds.maxX);
        sprint.dirX = -Math.abs(sprint.dirX);
      }

      if (nextY < bounds.minY) {
        nextY = bounds.minY + (bounds.minY - nextY);
        sprint.dirY = Math.abs(sprint.dirY);
      } else if (nextY > bounds.maxY) {
        nextY = bounds.maxY - (nextY - bounds.maxY);
        sprint.dirY = -Math.abs(sprint.dirY);
      }

      dogMotion.x = clamp(nextX, 0, bounds.maxX);
      dogMotion.y = clamp(nextY, bounds.minY, bounds.maxY);
      dogMotion.facing = sprint.dirX >= 0 ? 1 : -1;
      sprint.remaining -= step;

      elements.maltipoo.classList.add("walking");
      setDogTransform(dogMotion.x, dogMotion.y, dogMotion.facing);

      if (sprint.remaining <= 0.5) {
        sprint.active = false;
        elements.maltipoo.classList.remove("sprinting");
        chooseDogTarget();
      }
    }

    function moveDog(timestamp) {
      if (!elements.maltipoo) return;

      if (dogMotion.lastFrame === null) {
        dogMotion.lastFrame = timestamp;
      }

      const elapsedSeconds = Math.min(0.08, (timestamp - dogMotion.lastFrame) / 1000);
      dogMotion.lastFrame = timestamp;

      if (dogMotion.acting) {
        elements.maltipoo.classList.remove("walking");
      } else if (dogMotion.sprint?.active) {
        stepDogSprint(elapsedSeconds);
      } else if (!dogMotion.paused) {
        const dx = dogMotion.targetX - dogMotion.x;
        const dy = dogMotion.targetY - dogMotion.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 2) {
          elements.maltipoo.classList.remove("walking");
          chooseDogTarget();
        } else {
          elements.maltipoo.classList.add("walking");
          const step = Math.min(distance, dogMotion.speed * elapsedSeconds);
          dogMotion.x += (dx / distance) * step;
          dogMotion.y += (dy / distance) * step;
          dogMotion.facing = dx >= 0 ? 1 : -1;
          setDogTransform(dogMotion.x, dogMotion.y, dogMotion.facing);
        }
      } else {
        elements.maltipoo.classList.remove("walking");
      }

      dogMotion.animationFrame = requestAnimationFrame(moveDog);
    }

    function showMaltipoo() {
      if (!elements.maltipoo || !elements.dogBubble || dogMotion.acting) return;
      if (dogMotion.sprint?.active) {
        scheduleMaltipoo();
        return;
      }

      const card = randomUnknownCard();
      if (!card) {
        scheduleMaltipoo();
        return;
      }

      dogMotion.acting = true;
      dogMotion.paused = true;
      elements.maltipoo.classList.remove("walking");
      clearDogTimers();
      hideDogBubble();

      const dogWidth = elements.maltipoo.getBoundingClientRect().width || 112;
      const headFacing = dogMotion.facing || 1;
      const actionX = dogMotion.x;
      const groundY = dogMotion.y;
      const action = Math.random() < 0.5 ? "pee" : "poop";

      dogMotion.stageTimer = window.setTimeout(() => {
        showDogBubbleAtHead(card);
      }, 0);

      dogMotion.bubbleTimer = window.setTimeout(() => {
        hideDogBubble();
        setDogTransform(actionX, groundY, headFacing);
        elements.maltipoo.classList.add(action === "pee" ? "peeing" : "pooping");
        if (action === "poop") {
          const anusX = headFacing === 1 ? actionX + dogWidth * 0.24 : actionX + dogWidth * 0.74;
          const anusY = groundY + dogWidth * 0.4;
          const shadowGroundY = groundY + dogWidth * (91 / 130);
          dropDogPoop(anusX, anusY, shadowGroundY);
        }
      }, DOG_WORD_VISIBLE_MS);

      const actionDuration = action === "pee" ? DOG_PEE_MS : DOG_POOP_MS;
      dogMotion.stageTimer = window.setTimeout(() => {
        elements.maltipoo.classList.remove("peeing", "pooping");
        dogMotion.acting = false;
        dogMotion.paused = false;
        dogMotion.lastFrame = null;
        chooseDogTarget();
        scheduleMaltipoo();
      }, DOG_WORD_VISIBLE_MS + actionDuration);
    }

    function initMaltipoo() {
      if (!elements.maltipoo || !elements.dogBubble) return;
      const bounds = dogBounds();
      const x = randomBetween(0, bounds.maxX);
      const y = randomBetween(bounds.minY, bounds.maxY);
      elements.maltipoo.setAttribute("class", "maltipoo visible");
      setDogTransform(x, y, Math.random() < 0.5 ? 1 : -1);
      chooseDogTarget();
      scheduleMaltipoo();
      dogMotion.animationFrame = requestAnimationFrame(moveDog);
    }

    function handleMaltipooResize() {
      if (!elements.maltipoo) return;
      const dogWidth = elements.maltipoo.getBoundingClientRect().width || 112;
      const x = clamp(dogMotion.x, 14, Math.max(14, window.innerWidth - dogWidth - 14));
      const bounds = dogBounds();
      const y = clamp(dogMotion.y, bounds.minY, bounds.maxY);
      setDogTransform(x, y, dogMotion.facing);
      dogMotion.targetX = clamp(dogMotion.targetX, 0, bounds.maxX);
      dogMotion.targetY = clamp(dogMotion.targetY, bounds.minY, bounds.maxY);
      if (elements.dogBubble.classList.contains("visible")) {
        positionDogBubble();
      }
    }

    function handleSceneResize() {
      handleKoiResize();
      handleMaltipooResize();
    }

    function initialFontSize(text, maxPx, longTextAt, minPx) {
      const cleanLength = text.trim().length;
      if (cleanLength <= 18) return maxPx;
      const ratio = Math.min(1, Math.max(0, (cleanLength - 18) / (longTextAt - 18)));
      return Math.round(maxPx - (maxPx - minPx) * ratio);
    }

    function fitTextToContainer(element, options) {
      const { text, maxPx, minPx, longTextAt } = options;
      element.style.fontSize = `${initialFontSize(text, maxPx, longTextAt, minPx)}px`;

      requestAnimationFrame(() => {
        let size = Number.parseFloat(element.style.fontSize);
        while (
          size > minPx &&
          (element.scrollWidth > element.clientWidth || element.scrollHeight > element.clientHeight)
        ) {
          size -= 1;
          element.style.fontSize = `${size}px`;
        }
      });
    }

    function chooseCardPrompt(card) {
      return {
        promptText: card.czech,
        answerText: card.german,
        exampleText: card.example || null
      };
    }

    function renderCard(card) {
      currentCard = card;
      currentPrompt = chooseCardPrompt(card);
      answerVisible = false;
      elements.germanText.textContent = currentPrompt.promptText;
      fitTextToContainer(elements.germanText, {
        text: currentPrompt.promptText,
        maxPx: 32,
        minPx: 18,
        longTextAt: 50
      });
      elements.answerText.textContent = "";
      elements.exampleText.textContent = "";
      elements.answerStack.classList.add("hidden");
      elements.answerStack.classList.remove("prepare-pop", "pop-from-steamer");
      elements.answerText.classList.add("hidden");
      elements.sweetPotato.classList.toggle("active", Boolean(currentPrompt.exampleText));
      elements.audioButton.disabled = !card.audio;
      elements.toggleAnswer.textContent = "Pop answer";
      elements.completeView.style.display = "none";
      elements.cardStage.style.display = "grid";
      updateProgress();
    }

    function showCard(card, animatePop = true) {
      clearSteamerTimers();
      renderCard(card);

      if (!animatePop) {
        elements.flashcard.className = "flashcard enter";
        return;
      }

      elements.scene.classList.remove("lid-open");
      elements.flashcard.className = "flashcard prepare-pop";

      lidTimer = window.setTimeout(() => {
        elements.scene.classList.add("lid-open");
        popTimer = window.setTimeout(() => {
          elements.flashcard.className = "flashcard pop-from-steamer";
          finishPopTimer = window.setTimeout(() => {
            elements.flashcard.className = "flashcard";
            lidCloseTimer = window.setTimeout(() => {
              elements.scene.classList.remove("lid-open");
            }, LID_CLOSE_AFTER_POP_DELAY);
          }, POP_DURATION);
        }, POP_AFTER_LID_DELAY);
      }, LID_OPEN_DELAY);
    }

    function showComplete() {
      currentCard = null;
      currentPrompt = null;
      elements.cardStage.style.display = "none";
      elements.completeView.style.display = "block";
      elements.completeReviewed.textContent = `Reviewed today: ${todayStats.reviewed}`;
      elements.completeBreakdown.textContent = `Known: ${todayStats.known} · Unsure: ${todayStats.unsure} · Unknown: ${todayStats.unknown}`;
      updateProgress();
    }

    function showNextCard() {
      const nextCard = queue.shift();
      if (nextCard) {
        showCard(nextCard);
      } else {
        showComplete();
      }
    }

    function toggleAnswerWithSteamer() {
      if (!currentCard || animating || dumplingAnimating) return;
      clearTimeout(lidTimer);
      clearTimeout(lidCloseTimer);
      clearTimeout(dumplingPopTimer);
      clearTimeout(finishDumplingPopTimer);

      dumplingAnimating = true;
      elements.scene.classList.remove("lid-open");

      lidTimer = window.setTimeout(() => {
        elements.scene.classList.add("lid-open");
      dumplingPopTimer = window.setTimeout(() => {
          elements.answerStack.style.animation = "none";

          if (answerVisible) {
            elements.answerStack.className = "answer-stack";
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                elements.answerStack.style.animation = "";
                elements.answerStack.className = "answer-stack return-to-steamer";
              });
            });
          } else {
            const answerText = currentPrompt?.answerText || currentCard.german;
            elements.answerText.textContent = answerText;
            elements.answerText.classList.remove("hidden");
            fitTextToContainer(elements.answerText, {
              text: answerText,
              maxPx: 22,
              minPx: 13,
              longTextAt: 55
            });

            const exampleText = currentPrompt?.exampleText;
            if (exampleText) {
              elements.exampleText.textContent = exampleText;
              fitTextToContainer(elements.exampleText, {
                text: exampleText,
                maxPx: 17,
                minPx: 12,
                longTextAt: 60
              });
            }

            elements.answerStack.className = "answer-stack prepare-pop";
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                elements.answerStack.style.animation = "";
                elements.answerStack.className = "answer-stack pop-from-steamer";
              });
            });
          }

          const duration = answerVisible ? DUMPLING_RETURN_DURATION : DUMPLING_POP_DURATION;
          finishDumplingPopTimer = window.setTimeout(() => {
            if (answerVisible) {
              answerVisible = false;
              elements.answerText.textContent = "";
              elements.answerText.classList.add("hidden");
              elements.exampleText.textContent = "";
              elements.answerStack.style.animation = "";
              elements.answerStack.className = "answer-stack hidden";
            } else {
              answerVisible = true;
              elements.answerStack.style.animation = "";
              elements.answerStack.className = "answer-stack";
            }

            dumplingAnimating = false;
            lidCloseTimer = window.setTimeout(() => {
              elements.scene.classList.remove("lid-open");
            }, LID_CLOSE_AFTER_POP_DELAY);
          }, duration);
        }, DUMPLING_POP_AFTER_LID_DELAY);
      }, LID_OPEN_DELAY);
    }

    function nextKnownInterval(reviewCount, previousInterval) {
      const steps = [1, 3, 7, 14];
      if (reviewCount <= steps.length) {
        return steps[reviewCount - 1];
      }
      return Math.max(1, Math.round(previousInterval * 2));
    }

    function updateReviewState(card, result) {
      const existing = getState(card);
      const now = new Date();
      const state = {
        status: existing?.status || "learning",
        ease: existing?.ease || DEFAULT_EASE,
        intervalDays: existing?.intervalDays || 0,
        dueDate: existing?.dueDate || todayKey(),
        reviewCount: existing?.reviewCount || 0,
        wrongCount: existing?.wrongCount || 0,
        lastReviewed: now.toISOString()
      };

      const wasNew = !existing;
      state.reviewCount += 1;

      // MVP spaced repetition rules:
      // known increases the interval, unsure keeps the card close, and unknown
      // lowers ease while sending the card back into this session soon.
      if (result === "known") {
        state.status = "review";
        state.ease = Number((state.ease + 0.05).toFixed(2));
        state.intervalDays = nextKnownInterval(state.reviewCount, state.intervalDays);
        state.dueDate = dateOnly(addDays(now, state.intervalDays));
      }

      if (result === "unsure") {
        state.status = "learning";
        state.ease = Math.max(MIN_EASE, Number((state.ease - 0.05).toFixed(2)));
        state.intervalDays = 1;
        state.dueDate = dateOnly(addDays(now, 1));
        insertSoon(card, 2);
      }

      if (result === "unknown") {
        state.status = "learning";
        state.ease = Math.max(MIN_EASE, Number((state.ease - 0.2).toFixed(2)));
        state.intervalDays = 0;
        state.dueDate = todayKey();
        state.wrongCount += 1;
        insertSoon(card, 1);
      }

      if (wasNew) {
        todayStats.newIntroduced += 1;
      }

      todayStats.reviewed += 1;
      todayStats[result] += 1;
      cardStates[card.id] = state;
      saveState();
      renderUnknownList();
    }

    function insertSoon(card, offset) {
      const withoutCurrentCard = queue.filter((queuedCard) => queuedCard.id !== card.id);
      queue = withoutCurrentCard;
      queue.splice(Math.min(offset, queue.length), 0, card);
    }

    function answer(result, exitClass) {
      if (!currentCard || animating) return;
      animating = true;
      const reviewedCard = currentCard;

      clearSteamerTimers();
      updateReviewState(reviewedCard, result);
      updateProgress();
      elements.flashcard.className = `flashcard ${exitClass}`;

      window.setTimeout(() => {
        elements.answerStack.className = "answer-stack hidden";
        elements.answerText.classList.add("hidden");
        elements.exampleText.textContent = "";
        animating = false;
        showNextCard();
      }, EXIT_DURATION);
    }

    function playPronunciation() {
      if (!currentCard || !currentCard.audio) return;
      const audio = new Audio(currentCard.audio);
      audio.play().catch((error) => {
        elements.loadStatus.textContent = "Audio unavailable";
        console.warn("Audio playback failed", error);
      });
    }

    function bindEvents() {
      elements.toggleAnswer.addEventListener("click", toggleAnswerWithSteamer);
      elements.flashcard.addEventListener("click", toggleAnswerWithSteamer);
      elements.knownButton.addEventListener("click", () => answer("known", "exit-left"));
      elements.unsureButton.addEventListener("click", () => answer("unsure", "exit-up"));
      elements.unknownButton.addEventListener("click", () => answer("unknown", "exit-right"));
      elements.audioButton.addEventListener("click", playPronunciation);
      elements.dpadPop.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleAnswerWithSteamer();
      });
      elements.dpadKnown.addEventListener("click", (event) => {
        event.stopPropagation();
        answer("known", "exit-left");
      });
      elements.dpadUnsure.addEventListener("click", (event) => {
        event.stopPropagation();
        answer("unsure", "exit-up");
      });
      elements.dpadUnknown.addEventListener("click", (event) => {
        event.stopPropagation();
        answer("unknown", "exit-right");
      });
      elements.dpadAudio.addEventListener("click", (event) => {
        event.stopPropagation();
        playPronunciation();
      });
      elements.maltipoo.addEventListener("click", (event) => {
        event.stopPropagation();
        startDogSprint();
      });
      elements.unknownPanelToggle.addEventListener("click", () => {
        setUnknownPanelOpen(!elements.unknownPanel.classList.contains("open"));
      });
      elements.unknownPanelClose.addEventListener("click", () => setUnknownPanelOpen(false));
      elements.unknownList.addEventListener("click", (event) => {
        const removeButton = event.target.closest(".unknown-remove");
        if (!removeButton) return;
        removeUnknownCard(removeButton.dataset.cardId);
      });
      elements.sourceRadios.forEach((radio) => {
        radio.addEventListener("change", (event) => {
          if (!event.target.checked) return;
          switchSource(event.target.value);
        });
      });
      elements.settingsPanelToggle.addEventListener("click", () => {
        setSettingsPanelOpen(!elements.scene.classList.contains("settings-open"));
      });
      window.addEventListener("resize", handleSceneResize);
      elements.dailyTargetInput.addEventListener("change", (event) => {
        saveDailyTarget(event.target.value);
        queue = buildSessionQueue();
        if (!currentCard) {
          showNextCard();
        } else {
          updateProgress();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.target === elements.dailyTargetInput) return;

        if (event.code === "Space") {
          event.preventDefault();
          toggleAnswerWithSteamer();
        }
        if (event.code === "ArrowLeft") {
          event.preventDefault();
          answer("known", "exit-left");
        }
        if (event.code === "ArrowUp") {
          event.preventDefault();
          answer("unsure", "exit-up");
        }
        if (event.code === "ArrowRight") {
          event.preventDefault();
          answer("unknown", "exit-right");
        }
        if (event.code === "ArrowDown") {
          event.preventDefault();
          playPronunciation();
        }
        if (event.code === "Escape") {
          setUnknownPanelOpen(false);
          setSettingsPanelOpen(false);
        }
      });
    }

    async function loadCards(source) {
      const response = await fetch(SOURCES[source].url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadAndStartSource(source) {
      currentSource = SOURCES[source] ? source : DEFAULT_SOURCE;
      saveSource(currentSource);
      elements.sourceRadios.forEach((radio) => {
        radio.checked = radio.value === currentSource;
      });
      cardStates = loadJson(statesKey(), {});
      todayStats = loadStatsForToday();
      currentCard = null;
      currentPrompt = null;
      elements.loadStatus.textContent = "Loading";

      try {
        cards = await loadCards(currentSource);
        queue = buildSessionQueue();
        elements.loadStatus.textContent = `${cards.length} cards`;
        renderUnknownList();
        showNextCard();
      } catch (error) {
        elements.loadStatus.textContent = "Load failed";
        elements.germanText.textContent = `Could not load ${SOURCES[currentSource].url}`;
        elements.answerText.textContent = "Start a local server and try again.";
        elements.answerStack.classList.remove("hidden");
        elements.answerText.classList.remove("hidden");
        elements.toggleAnswer.disabled = true;
        document.querySelectorAll(".action-button").forEach((button) => {
          button.style.display = "none";
        });
        console.error(error);
      }
    }

    function switchSource(source) {
      if (source === currentSource || !SOURCES[source]) return;
      clearSteamerTimers();
      elements.scene.classList.remove("lid-open");
      elements.flashcard.className = "flashcard";
      elements.answerStack.className = "answer-stack hidden";
      elements.sweetPotato.classList.remove("active");
      elements.toggleAnswer.disabled = false;
      document.querySelectorAll(".action-button").forEach((button) => {
        button.style.display = "";
      });
      loadAndStartSource(source);
    }

    async function init() {
      dailyTarget = loadDailyTarget();
      elements.dailyTargetInput.value = dailyTarget;
      elements.targetNote.textContent = `Current target: ${dailyTarget}`;
      bindEvents();
      initKoi();
      initMaltipoo();
      renderUnknownList();
      await loadAndStartSource(loadSource());
    }

    init();
  </script>
</body>
